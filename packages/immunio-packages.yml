description: >-
  First-party IMMUNIO agent libraries. IMMUNIO (Montreal, founded 2013) shipped
  language-native RASP agents distributed through the public package registries;
  the agents embed in a web application and monitor requests in real time rather
  than acting as REST API clients. The company was acquired by Trend Micro in
  November 2017 and its product surface (immun.io / docs.immun.io) has since been
  retired, so these registry artifacts are the durable record of the client
  surface. Package identity and versions confirmed against pypi.org,
  rubygems.org and registry.npmjs.org at fetch time. Author on every registry is
  "Immunio". No first-party Packagist (PHP) or Maven Central (Java) package was
  found under the immunio namespace; the PHP and Java agents were distributed as
  binary agents (.so / jar) via the documentation rather than a public registry.
